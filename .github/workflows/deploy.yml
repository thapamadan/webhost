name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without pushing an empty commit.
  workflow_dispatch:

# Never let two deploys race. Queue them instead of cancelling, so the newest
# commit is always what ends up live.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        env:
          # The default preset is already cloudflare-module, but nitro also
          # auto-detects the host platform. Pinning it keeps a CI build from
          # ever silently targeting something else.
          NITRO_PRESET: cloudflare-module
        run: npm run build

      # Without this, a missing secret surfaces as an opaque wrangler auth
      # error buried in the deploy output.
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. Add it under Settings -> Secrets and variables -> Actions."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "See the Deployment section of README.md for the full one-time setup."
            exit 1
          fi
          echo "Both Cloudflare secrets are present."

      # Reads .wrangler/deploy/config.json, which the build step just wrote, and
      # follows it to the merged config at .output/server/wrangler.json.
      #
      # If this fails on binding a custom domain, the old GitHub Pages DNS
      # record for that hostname is still in Cloudflare DNS. Delete it and
      # re-run; wrangler will not overwrite a conflicting record.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
