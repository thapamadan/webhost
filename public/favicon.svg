<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Madan Thapa">
  <style>
    /* Matches --primary from src/styles.css. The light-theme terracotta is too
       dark to read against a dark tab strip, so swap to the dark-theme tint. */
    .bg { fill: #ae5528; }
    .mark { stroke: #fbf8f2; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #e58b55; }
      .mark { stroke: #130e0b; }
    }
  </style>
  <rect class="bg" width="64" height="64" rx="14" />
  <path
    class="mark"
    d="M18 46 V18 L32 36 L46 18 V46"
    fill="none"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
